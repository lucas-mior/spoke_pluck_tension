name: Test on various platforms CI

on:
  push:
    branches:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          xcode-select --install 2>/dev/null || true
          brew install rtaudio
          cc --version

      - name: Build
        run: |
          CPPFLAGS="-I$(brew --prefix rtaudio)/include" \
          LDFLAGS="-L$(brew --prefix rtaudio)/lib" \
          ./build.sh build

  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libpulse-dev
          git clone --depth 1 --branch 6.0.1 \
            https://github.com/thestk/rtaudio.git /tmp/rtaudio
          cmake -S /tmp/rtaudio -B /tmp/rtaudio/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DRTAUDIO_API_ALSA=OFF \
            -DRTAUDIO_API_JACK=OFF \
            -DRTAUDIO_API_PULSE=ON \
            -DRTAUDIO_BUILD_TESTING=OFF
          cmake --build /tmp/rtaudio/build --parallel
          sudo cmake --install /tmp/rtaudio/build
          sudo ldconfig
          cc --version

      - name: Build
        run: ./build.sh build

  freebsd:
    runs-on: ubuntu-latest
    name: FreeBSD VM
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y rtaudio
          run: |
            cc --version
            ./build.sh build
