name: audio_to_fifo CI

"on":
  push:
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y librtaudio-dev
          cc --version

      - name: Build audio_to_fifo
        run: ./build.sh build

      - name: Test source checks
        run: ./build.sh test
